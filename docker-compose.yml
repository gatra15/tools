services:
  nextapp:
    container_name: next_production
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: always

  nginx:
    image: nginx:1.25-alpine
    container_name: next_nginx
    ports:
      - "8080:80"
    depends_on:
      - nextapp
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
